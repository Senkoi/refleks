name: Adaptive Alpha Windows

on:
  push:
    branches: [adaptive-alpha]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Adaptive training tests
        run: go test ./internal/training
      - name: Application compile check
        run: go test .
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Windows application build
        shell: pwsh
        run: '& "$(go env GOPATH)\bin\wails.exe" build'
      - uses: actions/upload-artifact@v4
        with:
          name: refleks-adaptive-windows-alpha
          path: build/bin/refleks.exe
          if-no-files-found: error
