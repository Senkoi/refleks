name: AimMeow Windows

on:
  push:
    branches: [main, adaptive-alpha, research/scenario-difficulty-preparation, fix/automatic-player-training, "brand/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run test:catalog
          npm run build
      - name: Full Go regression tests
        run: go test ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SCE extraction tests
        run: python -m unittest discover -s docs/research/difficulty-acquisition-2026-10-02/tools -p "test_*.py"
      - name: Application compile check
        run: go test .
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Windows application build
        shell: pwsh
        run: '& "$(go env GOPATH)\bin\wails.exe" build'
      - uses: actions/upload-artifact@v4
        with:
          name: aimmeow-windows-alpha
          path: |
            build/bin/aimmeow.exe
            LICENSE
            THIRD_PARTY_NOTICES.md
            README.md
          if-no-files-found: error
